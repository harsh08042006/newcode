<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
                   
     
        .box1{
            width: 100px;
            height: 100px;
            background-color:rgb(227, 125, 238);
            transition: all 1s ease ;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            animation: mymove  6s infinite;
            animation-duration: 6s;
            /* border-radius: 50%; */
        }

        .box1:hover{
                 /* border-radius: 50; */
                 border-radius: 50%;
                 transform: rotate(360deg);
                 font-size: 89px;
                 border: 5px solid;

                 
        }
        @keyframes mymove{
            from {top: 0px;}
                 50%{
                    
                    top: 200px;
                 }
            to { top: 0px;}
            from {background-color:pink;}
             50%{
                background-color:red;
             }
            to{
                background-color: aquamarine;
            }
            
        }
        .box2{
           width: 100px;
           height: 100px;
           border: 2px solid;
           
           transition: all 3s ease-in-out;
         
        }
        .box2:hover{
            background-color: blue;
            border-radius: 20px;
            
            transform: translatey(100px)  rotatex(90deg) skew(90deg);
            
        }
        
    </style>
</head>
<body>
    <div class="box1">&#128500 </div>
    <div class="box2">Click me</div>
                


    </div>
</body>
</html>
