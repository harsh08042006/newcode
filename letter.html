<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .con{
            display: grid;
            grid-template-columns: repeat(5,100px);
            grid-template-rows: repeat(5,100px);
            justify-content: center;
            justify-self: center;

        }
    .d1{
            background-color: cadetblue;
            grid-row: 1/6;
        }
        .d2{
            background-color: cadetblue;
            grid-column: 2/5;
            grid-row: 3/4;
        }
        .d3{
            background-color: cadetblue;
            grid-column: 5/6;
            grid-row: 1/6;
        }

    </style>
</head>
<body>
    <div class="con">
        <div class="d1"></div>
         <div class="d2"></div>
         <div class="d3"></div>
    </div>
</body>
</html>
