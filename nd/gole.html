<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            display: flex;
           place-items: center;
            gap: 10px;
        }
        .dot{
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 1px solid;
            display: inline-block;
            animation: bounce 2s ease-in-out infinite;
        }
        .dot:nth-child(1){
            animation-delay: 0s;
        }
        .dot:nth-child(2){
            animation-delay: 0.12s;
        }
         .dot:nth-child(3){
            animation-delay: 0.24s;
        }
         .dot:nth-child(4){
            animation-delay: 0.36s;
        }
         .dot:nth-child(5){
            animation-delay: 0.48;
        }
     @keyframes bounce{
        0%,100%{
            transform: translateY(0px);
        }
        50%{
             transform: translateY(-20px);
        }
     }
    </style>
</head>
<body>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
</body>
</html>
