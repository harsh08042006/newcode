<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="box">
        <div id="box1"></div>
        <div id="box2"></div>
        <div id="box3"></div>
        <div id="box4"></div>
    </div>  
    
    

    <script>
        document.body.style.margin = '0';

        const box = document.querySelector('.box');
        box.style.position = 'relative';
        box.style.width = '100vw';
        box.style.height = '100vh';

        const boxes = document.querySelectorAll('.box div');
        boxes.forEach((element) => {
            element.style.position = 'absolute';
            element.style.width = '100px';
            element.style.height = '100px';
        });

        document.querySelector('#box1').style.top = '0';
        document.querySelector('#box1').style.left = '0';
        document.querySelector('#box1').style.backgroundColor = 'red';

        document.querySelector('#box2').style.top = '0';
        document.querySelector('#box2').style.right = '0';
        document.querySelector('#box2').style.backgroundColor = 'blue';

        document.querySelector('#box3').style.bottom = '0';
        document.querySelector('#box3').style.left = '0';
        document.querySelector('#box3').style.backgroundColor = 'green';

        document.querySelector('#box4').style.bottom = '0';
        document.querySelector('#box4').style.right = '0';
        document.querySelector('#box4').style.backgroundColor = 'yellow';
    </script>
</body>
</html>
