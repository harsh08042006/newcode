    <script>
       
        function calci(op,a,b){
            if(op=="+"){
                console.log(a+b);
            }
            else if(op=="-"){
                console.log(a-b);
            }
            else if(op=="*"){
                console.log(a*b);
            }
            else if(op=="/"){
                console.log(a/b);
            }}
            var a=56;
            var b=28;
            calci("-",a,b);
            calci("+",a,b);
            calci("/",a,b);
            calci("*",a,b);
            const arr=[1,3,4,6,8];
            for(var i of arr){
                console.log(i);
            }
        
            function greet(name){
                console.log("Good morning"+name);
            }
            greet("harsh");
    </script>
