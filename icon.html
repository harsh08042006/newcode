<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
 .card{
    display: flex;
    width: 400px;
    height: 550px;
    border: 2px solid;
    border-radius: 20px;
    flex-direction:column;
    flex-wrap: wrap;
    align-items: center;
    

 }
 .profile{
    height: 150px;
    width: 150px;
    border: 2px solid;
    margin-top: 20px;
    border-radius: 50%;
    position: absolute;
    top: 25px;
    left: 125px;
    background-image: url(/logo.png);
    background-size: contain;
    
    
 }
 .intro{
    height: 90px;
    width: 250px;
    
    margin-top: 50px;
    text-align: center;
 }
 .cir{
    height: 40px;
    width: 40px;
    border-radius: 50%;
    display: inline-block;
    border:1px solid;
    margin: 7px;
    
 }
 .icon{
    margin-top: 15px;
 }
 .action{
    display: flex;
    height: 70px;
    width: 320px;
    
    margin: 20px;
    justify-content: space-evenly;
    align-items: center;
 }
 .sub{
    width: 120px;
    height: 50px;
    border: 2px solid;
    border-radius: 40px;
    display: flex;
    justify-content: center;
    align-items: center;
 }
  .messa{
    width: 120px;
    height: 50px;
    border: 2px solid;
    border-radius: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
 }
.info{
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 350px;
    

}
 .like{
    width: 80px;
    height: 40px;
    border:2px solid ;

 }
 .comment{
    width: 80px;
    height: 40px;
    border:2px solid ;

 }
 .share{
    width: 80px;
    height: 40px;
    border:2px solid ;

 }
 .div{
    background-color: blue;
    width: 100%;
    
    border-radius: 20px 20px 0px 0px;
    
    
    height: 150px;
 }

    </style>
</head>
<body>
    <div class="card">
        <div class="div">
        <div class="profile"></div></div>
        <div class="intro">
            <h2>CodingLab</h2>
            <h3>Youtuber & Blogger</h3>
        </div>
        <div class="icon">
            <div class="cir"></div>
            <div class="cir"></div>
            <div class="cir"></div>
            <div class="cir"></div>
        </div>
        <div class="action">
            <div class="sub">Subscribe</div>
            <div class="messa">Message</div>
        </div>
        <div class="info">
        <div class="like"></div>
        <div class="comment"></div>
        <div class="share"></div>
    
    </div>
    </div>
</body>
</html>
