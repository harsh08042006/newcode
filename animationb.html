<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Segoe UI', sans-serif;
  background-color: #f0f3f8;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 40px;
  width: 90%;
  /* max-width: 1100px; */
  padding: 20px;
}


.profile-card {
  background: #ffffff;
  border-radius: 16px;
  overflow: hidden;
  /* box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05); */
  text-align: center;
  
  
  transition: transform 0.4s ease, box-shadow 0.4s ease;
}


.image-container {
  width: 100%;
  height: 240px;
  overflow: hidden;
}

.image-container img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  

  transition: transform 0.5s ease-in-out;
}


.card-content {
  padding: 24px;
}

.card-content h3 {
  color: #1e293b;
  margin-bottom: 6px;
}

.card-content p {
  color: #64748b;
  font-size: 14px;
  margin-bottom: 20px;
}

/* Button Micro-interactions */
.action-btn {
  background-color: #3b82f6;
  color: white;
  border: none;
  padding: 10px 24px;
  font-size: 14px;
  font-weight: 600;
  border-radius: 8px;
  cursor: pointer;
  
  /* Smooth shift for background color and micro-movement */
  transition: background-color 0.3s ease, transform 0.2s ease;
}

.profile-card:hover {
  transform: translateY(-12px);
  /* box-shadow: 0 20px 30px rgba(0, 0, 0, 0.12); */
}


.profile-card:hover .image-container img {
  transform: scale(1.1) rotate(2deg);
}


.action-btn:hover {
  background-color: #1d4ed8;
  transform: scale(1.05);
}

/* 4. Button Active/Click Micro-squeeze */
.action-btn:active {
  transform: scale(0.95);
}

</style>
</head>
<body>

<html lang="en">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Transform & Transition Project</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card-grid">
    
    <!-- Card 1 -->
    <div class="profile-card">

</html>
