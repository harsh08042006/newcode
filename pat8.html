<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    .container{
        display: grid;
        grid-template-columns: repeat(200px,4);
        grid-template-rows: repeat(100px,3);
         gap: 10px;
         height: 500px;
         width: 500px;
    }      
    .div1{
        grid-row: 1/3;
        grid-column: 1/3;
        background-color: blue;

    }
    .div2{
        
        grid-column: 1/3;
    
        background-color: aqua;

    }
    .div3{
        
        background-color: cadetblue;
        
    }
    .div4{
        
        background-color: cornflowerblue;
    }
    .div5{
        
        background-color: cornflowerblue;
    }
    </style>
</head>
<body>
    <div class="container">
        <div class="div1"></div>
        <div class="div2"></div>
        <div class="div3"></div>
        <div class="div4"></div>
        <div class="div5"></div>
    </div>
</body>
</html>
