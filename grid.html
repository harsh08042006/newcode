<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    .container{
display: grid;
grid-template-columns: 200px 1fr 200px ;
grid-template-rows:80px 1fr 60px;
grid-template-areas: 
"header header header"
"sidebar main aside"
"footer footer footer";
gap: 16px;
height: 100vh;
    }
    .item{
        background-color: aqua;
       
       

    }
    .header{
        grid-area: header;
    }
    .sidebar{
        grid-area: sidebar;
    }
    .main{
        grid-area: main;
    }
    

    </style>
</head>
<body>
    <div class="container">
     <div class="header"></div>
     <div class="sidebar"></div>
     <div class="aside"></div>
     <div class="main"></div>
     <div class="footer"></div>

             
                 
     </div>
</body>
</html>
